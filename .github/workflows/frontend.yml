name: Frontend CI

on:
  push:
    branches: [main, dev, exp]
    paths:
      - "segmentation/mlx_sam3/app/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "segmentation/mlx_sam3/app/frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: segmentation/mlx_sam3/app/frontend

jobs:
  lint-typecheck-build:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: segmentation/mlx_sam3/app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
