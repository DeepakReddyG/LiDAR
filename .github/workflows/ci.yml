name: Python CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Format, lint, syntax, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CI tools
        run: python -m pip install --disable-pip-version-check pytest ruff

      - name: Check formatting
        run: >-
          ruff format --check
          classification
          evaluation
          projection
          reprojection
          segmentation/segment_sam3.py
          config.py
          main.py

      - name: Lint Python
        run: >-
          ruff check
          --output-format=github
          classification
          evaluation
          projection
          reprojection
          segmentation/segment_sam3.py
          config.py
          main.py

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          classification
          evaluation
          projection
          reprojection
          segmentation/segment_sam3.py
          config.py
          main.py

      - name: Run unit tests
        shell: bash
        run: |
          if [[ -d tests ]] && find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pip install --disable-pip-version-check -r requirements.txt
            python -m pytest -q tests
          else
            echo "No lightweight tests found in tests/ yet; skipping pytest."
          fi
